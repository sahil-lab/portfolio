<!doctype html>
<html lang="en">
<head>

  <style>
    :root{color-scheme:light;font-family:'Palatino Linotype',Palatino,serif;color:#263535;background:#c9cecf;letter-spacing:0}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{position:fixed;inset:0;display:block;max-width:100vw;max-height:100dvh;touch-action:none}
