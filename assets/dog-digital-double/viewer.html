<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dog | Multi-View Study</title>
  <link rel="icon" href="data:,">
  <style>
    :root{font-family:'Palatino Linotype',Palatino,serif;letter-spacing:0;color:#253d38;background:#ccd1d0;color-scheme:light;--line:#a2b2ac;--active:#31594f}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{position:fixed;inset:0;display:block;max-width:100vw;max-height:100dvh;touch-action:none}
    header{position:fixed;left:25px;top:22px;pointer-events:none}header small{font:11px 'Trebuchet MS',sans-serif;color:#536860}h1{font-size:25px;font-weight:400;margin:5px 0}
    output{position:fixed;right:25px;top:25px;font:11px 'Trebuchet MS',sans-serif;color:#526860}
    footer{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 24px);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;font:12px 'Trebuchet MS',sans-serif}
    nav{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);background:#f0f4f1ed;border-radius:5px}
    button,select{min-height:44px;min-width:44px;font:inherit;letter-spacing:0;color:#263d36;border:1px solid transparent;border-radius:3px;background:transparent;white-space:nowrap;padding:0 11px;cursor:pointer}
    button[aria-pressed=true]{background:var(--active);color:#fafff8}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #316a58;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}
    label{display:flex;align-items:center;gap:6px;white-space:nowrap}select{border-color:var(--line);background:#f0f4f1ed}input{width:18px;height:18px;accent-color:var(--active)}#download{border-color:var(--line);background:#f0f4f1ed}
    @media(max-width:640px){header{left:16px;top:16px}h1{font-size:22px}output{right:16px;top:20px;font-size:9px}footer{width:calc(100% - 24px);gap:8px}nav{flex-basis:100%;justify-content:center}nav button{flex:1;padding:0 6px}label{font-size:11px}select{padding-inline:6px}}
  </style>
  <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <header><small>BLENDER / MULTI-VIEW STUDY</small><h1>Reference Dog</h1></header>
  <output id="status" role="status">Loading</output>
  <footer>
    <nav aria-label="Camera view"><button data-view="three_quarter" aria-pressed="true">3/4</button><button data-view="front" aria-pressed="false">Front</button><button data-view="left" aria-pressed="false">Left</button><button data-view="right" aria-pressed="false">Right</button><button data-view="rear" aria-pressed="false">Rear</button><button data-view="face" aria-pressed="false">Face</button></nav>
    <label>Detail <select id="lod" aria-label="Model detail"><option value="0">Full</option><option value="1">Medium</option><option value="2">Light</option></select></label>
    <label><input id="rotate" type="checkbox">Turntable</label><button id="download" disabled>Download GLB</button>
  </footer>
  <script type="module" src="/viewer.mjs"></script>
</body>
</html>
